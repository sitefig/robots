# Deploys the robots.txt proxy to Cloudflare Workers whenever worker/ changes on main.
#
# One-time setup: add a repository secret CLOUDFLARE_API_TOKEN holding a
# Cloudflare API token with the "Edit Cloudflare Workers" template permissions.
# The account is picked up from the token; set CLOUDFLARE_ACCOUNT_ID as a
# secret too if the token can see more than one account.

name: Deploy worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # A workers.dev subdomain must exist before the first publish. Wrangler
      # would prompt for it interactively, so register it here (no-op once set).
      - name: Ensure a workers.dev subdomain exists
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/subdomain"
          current=$(curl -sS "$api" -H "Authorization: Bearer $CF_TOKEN" | jq -r '.result.subdomain // empty')
          if [ -n "$current" ]; then echo "workers.dev subdomain: $current"; exit 0; fi
          for name in sitefig sitefig-tools sitefig-robots; do
            ok=$(curl -sS -X PUT "$api" -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
                 -d "{\"subdomain\":\"$name\"}" | jq -r '.success')
            if [ "$ok" = "true" ]; then echo "registered workers.dev subdomain: $name"; exit 0; fi
          done
          echo "could not register a workers.dev subdomain; register one in the Cloudflare dashboard" >&2
          exit 1

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          # The action's default Wrangler predates the [[ratelimits]] config key.
          wranglerVersion: '4.132.0'
          command: deploy
