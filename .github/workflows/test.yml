# Runs the website's test suites on every push and pull request: the page
# generator and the browser i18n, then the three accessibility checkers.
# The engine, the CLI and the packages are tested in sitefig/robots-engine.

name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'          # daily tracking snapshots, committed by famous-100.yml
  pull_request:

# Cost guards: a superseded run is cancelled, and no job can run away.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    # The page generator and the browser i18n. Fast, and it fails before the
    # accessibility job spends five minutes building.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true   # engine/: the dictionaries the pages are built from
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - run: npm test
  accessibility:
    # Three engines against the built site in every UI state: axe-core in
    # Chrome (both themes), html-validate's WCAG preset, and pa11y's
    # HTML_CodeSniffer. Builds the WASM engine and the Eleventy site first.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true   # engine/: the analysis, the dictionaries and the schema
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen
        run: |
          set -eu
          WBG=$(grep -oE 'wasm-bindgen = "[0-9.]+"' crates/wasm/Cargo.toml | grep -oE '[0-9.]+')
          curl -sSL "https://github.com/rustwasm/wasm-bindgen/releases/download/${WBG}/wasm-bindgen-${WBG}-x86_64-unknown-linux-musl.tar.gz" | tar xz
          sudo mv "wasm-bindgen-${WBG}-x86_64-unknown-linux-musl/wasm-bindgen" /usr/local/bin/
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'   # the runner has Google Chrome
      - run: npm run build:dev
      # Needs the engine's generated .d.ts from the build above.
      - run: npm run typecheck
      - run: npm run a11y
