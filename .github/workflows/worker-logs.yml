# Reads Workers Logs for the proxy, so what the worker is doing can be seen
# without opening the dashboard. Run it from the Actions tab; it optionally
# sends a request first so there is something fresh to read.
#
# It needs the same CLOUDFLARE_API_TOKEN as the deploy, with the
# "Workers Observability Read" permission added to it.

name: Worker logs

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: How many minutes back to read
        default: '15'
      probe:
        description: Send a test request to the worker first
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: worker-logs
  cancel-in-progress: true

jobs:
  logs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Send a test request
        if: ${{ inputs.probe }}
        run: |
          set -eu
          url=https://robots-proxy.sitefig.workers.dev
          for target in https://example.com https://www.bbc.co.uk; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' -H 'Origin: https://sus.bot' "$url/?url=$target")
            echo "probe $target -> HTTP $code"
          done
          # A refused origin, which should appear in the log as well.
          curl -sS -o /dev/null -w 'probe bad origin -> HTTP %{http_code}\n' -H 'Origin: https://not-allowed.test' "$url/?url=https://example.com"
          echo "waiting for the logs to land"
          sleep 25

      - name: Read the logs
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MINUTES: ${{ inputs.minutes }}
        run: |
          set -euo pipefail
          now=$(( $(date +%s) * 1000 ))
          from=$(( now - ${MINUTES:-15} * 60000 ))
          body=$(cat <<JSON
          {
            "queryId": "susbot-worker-logs",
            "timeframe": { "from": $from, "to": $now },
            "view": "events",
            "limit": 50,
            "parameters": {
              "filters": [
                { "key": "\$metadata.service", "operation": "includes", "type": "string", "value": "robots-proxy" }
              ]
            }
          }
          JSON
          )
          out=$(curl -sS -w '\n%{http_code}' -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/observability/telemetry/query" \
            -H "Authorization: Bearer $CF_TOKEN" -H 'Content-Type: application/json' \
            --data "$body")
          code=$(echo "$out" | tail -1)
          json=$(echo "$out" | sed '$d')
          if [ "$code" != 200 ]; then
            echo "::error::Cloudflare answered HTTP $code"
            echo "$json" | head -c 800
            echo
            echo "A 403 usually means the API token lacks the Workers Observability Read permission."
            exit 1
          fi
          echo "$json" > logs.json
          node -e '
            const r = JSON.parse(require("fs").readFileSync("logs.json", "utf8"));
            const events = r.result?.events?.events ?? r.result?.events ?? [];
            console.log(`events in the window: ${Array.isArray(events) ? events.length : 0}`);
            if (!Array.isArray(events) || events.length === 0) {
              console.log("Nothing came back. Either no request reached the worker in this window, or logging is off in wrangler.jsonc.");
              process.exit(0);
            }
            // Cloudflare returns the worker request record and, separately,
            // every console line the worker wrote. Ours are JSON objects.
            const rows = events.map((e) => ({
              when: e.timestamp ? new Date(e.timestamp).toISOString() : "",
              level: e.source?.level ?? e.$metadata?.level ?? "",
              message: e.source?.message ?? "",
              outcome: e.$workers?.outcome ?? "",
              status: e.$workers?.event?.response?.status ?? "",
            }));
            const ours = rows.filter((r) => r.message.trim().startsWith("{"));
            console.log(`lines the worker wrote: ${ours.length}, request records: ${rows.length - ours.length}`);
            console.log();
            for (const r of rows.slice(0, 25)) {
              console.log(`${r.when}  ${String(r.level).padEnd(5)} ${String(r.outcome).padEnd(8)} ${String(r.status).padEnd(3)} ${r.message.slice(0, 150)}`);
            }
            if (ours.length === 0) {
              console.log("\nNo line recognised as the worker's own. Here is an event that carried no message, in full:");
              const blank = events.find((e) => !(e.source?.message ?? "").trim());
              console.log(JSON.stringify(blank ?? events[0], null, 2).slice(0, 2500));
            }
          '
