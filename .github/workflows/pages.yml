# Builds the WebAssembly engine, renders the language pages and deploys the
# static site to GitHub Pages (sus.bot). Pages must be set to "GitHub Actions"
# as its source. The repo holds no built artifacts.

name: Deploy site

on:
  push:
    branches: [main]
    # Files that never reach the site do not trigger a build.
    paths-ignore:
      - 'data/**'
      - 'README.md'
      - 'CLAUDE.md'
      - 'LICENSE'
      - 'action.yml'
      - 'worker/**'
      - 'crates/cli/**'
      - '.github/workflows/test.yml'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen and wasm-opt
        run: |
          set -eu
          WBG=$(grep -oE 'wasm-bindgen = "[0-9.]+"' crates/wasm/Cargo.toml | grep -oE '[0-9.]+')
          curl -sSL "https://github.com/rustwasm/wasm-bindgen/releases/download/${WBG}/wasm-bindgen-${WBG}-x86_64-unknown-linux-musl.tar.gz" | tar xz
          sudo mv "wasm-bindgen-${WBG}-x86_64-unknown-linux-musl/wasm-bindgen" /usr/local/bin/
          curl -sSL https://github.com/WebAssembly/binaryen/releases/download/version_119/binaryen-version_119-x86_64-linux.tar.gz | tar xz
          sudo mv binaryen-version_119/bin/wasm-opt /usr/local/bin/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Tailwind builds css/site.css; the headless browser the a11y checkers
      # use is not needed here.
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
      - run: npm run build
      - run: npm run gen
      - run: npm test
      - name: Assemble the site
        run: |
          set -eu
          rm -rf dist && mkdir dist
          cp -r index.html js fonts locales schema examples sitemap.xml .nojekyll dist/
          mkdir dist/css && cp css/site.css dist/css/
          for d in bg cs da de el es et fi fr ga hr hu it lt lv mt nl pl pt ro sk sl sv; do cp -r "$d" dist/; done
          cp config/default.toml dist/default-config.toml
          echo "sus.bot" > dist/CNAME
          du -sh dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
