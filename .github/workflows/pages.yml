# Builds and publishes the site to GitHub Pages (sus.bot): the WebAssembly
# engine, then Eleventy (home page in every language, every Markdown page
# under src/site, sitemap.xml), Tailwind and the TypeScript client, all into
# _site/. Pages must be set to "GitHub Actions" as its source. The repo holds
# no built artifacts.

name: Deploy site

on:
  push:
    branches: [main]
    # Files that never reach the site do not trigger a build.
    paths-ignore:
      - 'data/**'
      - 'README.md'
      - 'CLAUDE.md'
      - 'LICENSE'
      - 'action.yml'
      - 'worker/**'
      - 'crates/cli/**'
      - 'crates/susbot/**'
      - 'crates/python/**'
      - '.github/workflows/release.yml'
      - 'npm/**'
      - 'scripts/npm-pack.mjs'
      - 'scripts/build-npm-wasm.sh'
      - '.github/workflows/test.yml'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen and wasm-opt
        run: |
          set -eu
          WBG=$(grep -oE 'wasm-bindgen = "[0-9.]+"' crates/wasm/Cargo.toml | grep -oE '[0-9.]+')
          curl -sSL "https://github.com/rustwasm/wasm-bindgen/releases/download/${WBG}/wasm-bindgen-${WBG}-x86_64-unknown-linux-musl.tar.gz" | tar xz
          sudo mv "wasm-bindgen-${WBG}-x86_64-unknown-linux-musl/wasm-bindgen" /usr/local/bin/
          curl -sSL https://github.com/WebAssembly/binaryen/releases/download/version_119/binaryen-version_119-x86_64-linux.tar.gz | tar xz
          sudo mv binaryen-version_119/bin/wasm-opt /usr/local/bin/
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # The headless browser the a11y checkers use is not needed here.
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
      - name: List the site
        run: |
          find _site -name index.html | sort
          du -sh _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  lighthouse:
    # Lighthouse against the site just published (English and German home
    # pages, mobile and desktop). Fails the run when accessibility, best
    # practices or SEO drop under 100 or performance under 90; the reports
    # are kept as an artifact.
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'   # the runner has Google Chrome
      - name: Wait until the new version is served
        run: |
          for i in $(seq 1 30); do
            curl -fsS "${{ needs.deploy.outputs.page_url }}?v=$RANDOM" -o /dev/null && break
            sleep 10
          done
      - run: node tests/lighthouse/run.mjs
        env:
          LH_SITE: ${{ needs.deploy.outputs.page_url }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: tests/lighthouse/.reports/
          include-hidden-files: true
          if-no-files-found: ignore
