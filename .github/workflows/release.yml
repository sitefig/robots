# Builds the Python package (crates/python: bindings plus the susbot command)
# and publishes it to PyPI as `susbot` when a version tag is pushed:
#
#   git tag v2.0.1 && git push origin v2.0.1
#
# PyPI trusts this workflow by name (trusted publishing: project susbot,
# repository sitefig/robots, workflow release.yml), so no token is stored.
# A manual run builds and tests everything but publishes nothing.
# The crates.io release stays manual; see CLAUDE.md.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches every crate version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          for f in Cargo.toml crates/python/Cargo.toml crates/susbot/Cargo.toml; do
            v=$(grep -m1 -E '^version = "' "$f" | cut -d'"' -f2)
            echo "$f: $v"
            [ "$v" = "$tag" ] || { echo "::error file=$f::version $v does not match tag v$tag"; exit 1; }
          done

  wheels:
    needs: check-version
    name: wheel ${{ matrix.os }} ${{ matrix.target }}${{ matrix.manylinux == 'musllinux_1_2' && ' musl' || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: auto, test: true }
          - { os: ubuntu-latest, target: aarch64, manylinux: auto }
          - { os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { os: ubuntu-latest, target: aarch64, manylinux: musllinux_1_2 }
          - { os: macos-latest, target: aarch64, test: true }
          - { os: macos-latest, target: x86_64 }
          - { os: windows-latest, target: x64, test: true }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || '' }}
          args: --release --locked --out dist
      - name: Test the wheel
        if: matrix.test
        shell: bash
        working-directory: crates/python
        run: |
          set -eu
          python -m pip install pytest
          python -m pip install --no-index --find-links dist susbot
          susbot --version
          # Run the tests against the installed wheel, not the source tree.
          cp -r tests "$RUNNER_TEMP/tests" && cd "$RUNNER_TEMP" && SUSBOT_REPO="$GITHUB_WORKSPACE" python -m pytest -q tests
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux || 'native' }}
          path: crates/python/dist/*.whl
          if-no-files-found: error

  sdist:
    needs: check-version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: crates/python/dist/*.tar.gz
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write   # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@release/v1
