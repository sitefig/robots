name = "robots-proxy"
main = "src/index.js"
compatibility_date = "2025-06-01"

# Browser origins allowed to call this worker, comma-separated, exact match.
# Add your GitHub Pages origin (https://<user>.github.io, no path) and any
# custom domain. Override per environment with `wrangler secret` or the dashboard.
[vars]
# Kill switch: flip to "true" in the dashboard (Settings > Variables) to make the
# worker answer 503 to everything at once, without a deploy. Requests still count
# against the daily quota, but nothing is fetched.
PAUSED = "false"
ALLOWED_ORIGINS = "http://localhost:8888,http://127.0.0.1:8888,https://sus.bot,https://www.sus.bot,https://sitefig.github.io"

# Rate limits (free, no extra service). Period may only be 10 or 60 seconds.
# PER_IP stops one client from hogging the quota; GLOBAL caps the worker as a
# whole so a distributed abuser cannot burn the Free plan's 100k requests/day.
# The front end's access check sends ~31 requests at 3 in flight, which fits.
[[ratelimits]]
name = "PER_IP"
namespace_id = "1001"
simple = { limit = 90, period = 60 }

[[ratelimits]]
name = "GLOBAL"
namespace_id = "1002"
simple = { limit = 40, period = 10 }
